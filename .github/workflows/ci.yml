name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # `edited` re-runs the PR title check when the title is changed
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types:
      - checks_requested

jobs:
  test:
    name: Run tests
    if: github.event.action != 'edited'
    # Not blocking: a failure here does not fail the workflow
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --target uta-test -t uta-test .
      - name: Run tests
        run: docker run --rm uta-test python -m unittest

  lint:
    name: Run ruff
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - name: Run ruff
        run: uv run --frozen --only-group dev ruff check .

  commits:
    name: Check commit messages and PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - name: Check commits in the pull request
        run: uv run --frozen --only-group dev cz check --rev-range "origin/${{ github.base_ref }}..HEAD"
      - name: Check pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | uv run --frozen --only-group dev cz check --commit-msg-file /dev/stdin; then
            echo "::error title=PR title is not a conventional commit::Retitle the PR as 'type(scope): subject', e.g. 'ci: run ruff'. Editing the title re-runs this check."
            exit 1
          fi
