[project]
name = "uta"
version = "0.0.0"
description = "Universal Transcript Archive"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

keywords = [
    "bioinformatics",
    "computational biology",
    "genome variants",
    "genome variation",
    "genomic variants",
    "genomic variation",
    "genomics",
    "hgvs",
]

authors = [
  {name = "UTA Contributors", email = "reecehart+uta@gmail.com" }
]
maintainers = [
  {name = "UTA Contributors", email = "reecehart+uta@gmail.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  "alembic",
  "attrs",
  "biocommons.seqrepo",
  "biopython>=1.69",
  "bioutils",
  "colorlog",
  "configparser",
  "docopt",
  "eutils>=0.3.2",
  "importlib_resources",
  "more_itertools",
  "prettytable",
  "psycopg2-binary",
  "pytz",
  "recordtype",
  "retry",
  "sqlalchemy",
  "uta-align>=0.3",
]

[project.optional-dependencies]
test = [
  "coverage",
  "parameterized",
  "testing.postgresql",
]

[project.urls]  # Optional
"Homepage" = "https://github.com/biocommons/uta"
"Bug Reports" = "https://github.com/biocommons/uta/issues"
"Source" = "https://github.com/biocommons/uta"

[project.scripts]
uta = "uta.cli:main"

# This is configuration specific to the `setuptools` build backend.
# If you are using a different build backend, you will need to change this.
[tool.setuptools]
# If there are data files included in your packages that need to be
# installed, specify them here.
package-data = {"sample" = ["*.dat"]}

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
# archive/, misc/EnsemblUTA/ and misc/bermuda/ are dead code (see AGENTS.md)
extend-exclude = ["tests", "archive", "misc/EnsemblUTA", "misc/bermuda"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
# E129, E221, E241, E251, E303 are preview-only in ruff
ignore = ["W291"]

[tool.ruff.lint.per-file-ignores]
# Applied migrations hold long SQL strings and the `import sqlalchemy as sa` from alembic's template
"src/alembic/versions/*" = ["E501", "F401"]
# Imports the models after configuring logging
"src/alembic/env.py" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.commitizen]
name = "cz_conventional_commits"
